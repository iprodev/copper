services:
    fetchr:
        image: ghcr.io/iprodev/fetchr:1

        init: true
        read_only: true
        restart: unless-stopped
        container_name: fetchr

        ports:
            - 9000:9000/tcp
            # if you use a reverse proxy (such as nginx),
            # uncomment the next line and remove the one above (9000:9000/tcp):
            # - 127.0.0.1:9000:9000

        environment:
            # replace https://api.url.example/ with your instance's url
            # or else tunneling functionality won't work properly
            API_URL: "https://api.url.example/"

            # if you want to use cookies for fetching data from services,
            # uncomment the next line & volumes section
            # COOKIE_PATH: "/cookies.json"

            # it's recommended to configure bot protection or api keys if the instance is public,
            # see /docs/protect-an-instance.md for more info

            # newgrounds blocks automated requests with a browser check,
            # so it's disabled. remove it from the list to enable it again
            DISABLED_SERVICES: "newgrounds"

            # uncomment to allow links from any site (generic extractor),
            # read docs/api-env-variables.md#enable_generic_extractor first
            # ENABLE_GENERIC_EXTRACTOR: "1"

            # uncomment (with the ytdlp service below) to look up links from
            # ~1800 other sites with yt-dlp, read docs/api-env-variables.md#ytdlp_url
            # YTDLP_URL: "http://ytdlp:4417/"

            # uncomment to send requests of some services through a proxy
            # (http, https, socks4 or socks5), read docs/api-env-variables.md#service_proxies
            # SERVICE_PROXIES: "youtube=socks5://user:password@10.0.0.3:1080"

            # see /docs/run-an-instance.md for more variables that you can use here

        labels:
            - com.centurylinklabs.watchtower.scope=fetchr

        # uncomment only if you use the COOKIE_PATH variable
        # volumes:
            # - ./cookies.json:/cookies.json

    # watchtower updates the fetchr image automatically
    watchtower:
        image: ghcr.io/containrrr/watchtower
        restart: unless-stopped
        command: --cleanup --scope fetchr --interval 900 --include-restarting
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock

    # if needed, use this image for automatically generating poToken & visitor_data
    # (and set YOUTUBE_SESSION_SERVER: http://youtube-pot:4416/ in the api's environment)
    # youtube-pot:
    #     image: brainicism/bgutil-ytdlp-pot-provider:2.0.2

    #     init: true
    #     restart: unless-stopped
    #     container_name: youtube-pot
    #     labels:
    #       - com.centurylinklabs.watchtower.scope=fetchr

    # if needed, use this image for links from other sites (with YTDLP_URL in
    # the api's environment). don't publish its port, only the api should reach
    # it. it updates yt-dlp by itself, see docs/api-env-variables.md#ytdlp_url
    # ytdlp:
    #     image: ghcr.io/iprodev/fetchr-ytdlp:latest
    #     init: true
    #     restart: unless-stopped
    #     container_name: ytdlp
    #     mem_limit: 768m
    #     labels:
    #       - com.centurylinklabs.watchtower.scope=fetchr
