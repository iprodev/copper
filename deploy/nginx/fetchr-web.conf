# fetchr web app (static files), managed by fetchr's install.sh
server {
    listen 80;
    listen [::]:80;
    server_name __WEB_DOMAIN__;

    root /var/www/fetchr/current;
    index index.html;

    # needed for on-device processing (shared memory for ffmpeg in the browser)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        # prerendered pages are files like settings.html, the rest is the app
        try_files $uri $uri.html $uri/ /404.html;
    }

    # file names in _app/immutable change with every build
    location /_app/immutable/ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /_headers {
        return 404;
    }

    # fetchr-mjs: javascript modules (ffmpeg in the browser). nginx versions
    # that don't know the .mjs extension (like ubuntu 24.04's) send it as
    # application/octet-stream, and browsers refuse to run that as a module.
    # no add_header here, so the headers above (cross-origin isolation) apply.
    location ~* \.mjs$ {
        default_type text/javascript;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
}
