name: Build release

# runs when a version tag (e.g. v1.0.0) is pushed or a release is created
# from one, and can also be started by hand
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    name: docker image (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # api: ghcr.io/<owner>/fetchr, telegram bot: ghcr.io/<owner>/fetchr-bot,
          # yt-dlp for other sites: ghcr.io/<owner>/fetchr-ytdlp
          - target: api
            image: ${{ github.repository }}
          - target: bot
            image: ${{ github.repository }}-bot
          - target: ytdlp
            image: ${{ github.repository }}-ytdlp
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use the version of the release tag
        # api/web/bot show their version (server info, settings page),
        # it's taken from the tag so it always matches the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in api/package.json web/package.json bot/package.json; do
            jq --arg version "$version" '.version = $version' "$file" > "$file.tmp"
            mv "$file.tmp" "$file"
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get release metadata
        id: release-meta
        run: |
            # the version comes from the release tag (v1.2.3 -> 1.2.3),
            # or from api/package.json when the workflow is started by hand
            if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
                version="${GITHUB_REF_NAME#v}"
            else
                version=$(cat api/package.json | jq -r .version)
            fi
            echo "commit_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            echo "version=$version" >> $GITHUB_OUTPUT
            echo "major_version=$(echo "$version" | cut -d. -f1)" >> $GITHUB_OUTPUT
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.release-meta.outputs.version }}
            type=raw,value=${{ steps.release-meta.outputs.major_version }}
            type=raw,value=${{ steps.release-meta.outputs.version }}-${{ steps.release-meta.outputs.commit_short }}
          images: ${{ env.REGISTRY }}/${{ matrix.image }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  web:
    name: web build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Use the version of the release tag
        # api/web/bot show their version (server info, settings page),
        # it's taken from the tag so it always matches the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in api/package.json web/package.json bot/package.json; do
            jq --arg version "$version" '.version = $version' "$file" > "$file.tmp"
            mv "$file.tmp" "$file"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile

      # the frontend is static, its domain and api are set at build time.
      # they can be changed with the WEB_HOST and WEB_DEFAULT_API repository variables.
      - run: pnpm run --prefix web build
        env:
          WEB_HOST: ${{ vars.WEB_HOST || 'fetchr.download' }}
          WEB_DEFAULT_API: ${{ vars.WEB_DEFAULT_API || 'https://api.fetchr.download/' }}

      - run: tar -czf fetchr-web.tar.gz -C web/build .

      - uses: actions/upload-artifact@v4
        with:
          name: fetchr-web
          path: fetchr-web.tar.gz

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" fetchr-web.tar.gz --clobber
